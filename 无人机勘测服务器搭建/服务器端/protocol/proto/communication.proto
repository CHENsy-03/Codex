syntax = "proto3";

package uav_server;

// 通信帧头 (44 bytes total)
message FrameHeader {
    bytes magic = 1;              // 2 bytes: 0xA5 0x5A
    uint32 version = 2;           // 1 byte
    uint32 msg_type = 3;          // 1 byte: 001=Heartbeat,002=GNSS,...
    string device_id = 4;         // 8 bytes
    string session_id = 5;        // 16 bytes
    uint32 sequence = 6;          // 4 bytes
    int64 timestamp = 7;          // 8 bytes
    uint32 payload_length = 8;    // 4 bytes
}

// 消息类型枚举
enum MessageType {
    HEARTBEAT = 0;
    GNSS = 1;
    IMU = 2;
    STATUS = 3;
    FILE_TRANSFER = 4;
    ACK = 5;
    NACK = 6;
    CONFIG = 7;
    COMMAND = 8;
}

// 心跳消息
message Heartbeat {
    string device_id = 1;
    string session_id = 2;
    uint32 sequence = 3;
    int64 timestamp = 4;
    string status = 5;           // online/offline/low_battery
}

// ACK 确认消息
message AckMessage {
    string device_id = 1;
    uint32 ack_sequence = 2;
    string status = 3;           // ok/error
}

// 通信帧 (Header + 任意 Payload)
message CommunicationFrame {
    FrameHeader header = 1;
    bytes payload = 2;           // 序列化后的具体消息
    uint32 crc = 3;              // CRC32校验
}
