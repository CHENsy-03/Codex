# 无人机勘测服务器 V2.0 配置文件
# 层级: center > province > city > county

server:
  id: "YN-ZT-YS-001"          # 省-市-县-编号
  name: "永善县服务器"
  level: "county"              # county / city / province / center
  host: "0.0.0.0"
  port: 9000

database:
  path: "data/gnss_data.duckdb"
  memory_limit: "4GB"          # DuckDB 内存限制
  temp_directory: "data/temp"  # 临时目录

network:
  priority: ["5g", "4g", "wifi", "satellite"]
  heartbeat_interval: 30       # 心跳间隔(秒)
  session_timeout: 120         # Session超时(秒)

protocol:
  supported: ["GPGGA", "BESTPOS"]
  version: "2.0"
  crc_enabled: true
  encrypt: false

sync:
  upstream_id: "YN-ZT-001"    # 上级服务器ID
  sync_interval: 60            # 同步间隔(秒)
  batch_size: 1000             # 批量同步条数
  retry_max: 3                 # 最大重试次数

logging:
  level: "INFO"
  file: "data/server.log"
  max_size_mb: 100
  backup_count: 5
